<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星枢智控 · 全息中枢</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }

        body {
            background: #000208;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(0,170,255,0.08) 0%, transparent 25%),
                radial-gradient(circle at 80% 70%, rgba(0,255,140,0.08) 0%, transparent 25%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .container {
            max-width: 800px;
            background: rgba(10,15,35,0.9);
            border: 1px solid #00aaff33;
            border-radius: 28px;
            padding: 55px 50px;
            backdrop-filter: blur(25px);
            box-shadow: 0 0 100px #00aaff15;
            text-align: center;
            position: relative;
            z-index: 2;
            animation: glow 3s infinite alternate ease-in-out;
        }

        @keyframes glow {
            from { box-shadow: 0 0 80px #00aaff15; }
            to { box-shadow: 0 0 140px #00aaff25; }
        }

        .title {
            font-size: 38px;
            color: #00aaff;
            margin-bottom: 10px;
            text-shadow: 0 0 30px #00aaff;
        }

        .subtitle {
            color: #b0d0ff;
            margin-bottom: 50px;
            font-size: 16px;
            letter-spacing: 2px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 50px;
        }

        .card {
            background: rgba(255,255,255,0.03);
            border: 1px solid #00aaff22;
            border-radius: 20px;
            padding: 30px 22px;
            transition: 0.4s;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0,170,255,0.1), transparent);
            transition: 0.6s;
        }

        .card:hover::before {
            left: 100%;
        }

        .card:hover {
            background: rgba(0,170,255,0.12);
            transform: translateY(-7px);
            box-shadow: 0 10px 30px rgba(0,170,255,0.25);
            border-color: #00aaff55;
        }

        .card h3 {
            color: #00ff88;
            margin-bottom: 10px;
            font-size: 22px;
        }

        .card p {
            color: #c0d8ff;
            font-size: 14px;
        }

        .btn-back {
            padding: 17px 45px;
            background: linear-gradient(90deg, #00aaff, #00ff88);
            color: #000;
            font-weight: bold;
            border: none;
            border-radius: 15px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.35s;
            box-shadow: 0 0 40px rgba(0,170,255,0.4);
        }

        .btn-back:hover {
            transform: scale(1.08);
            box-shadow: 0 0 60px rgba(0,170,255,0.6);
        }

        /* 高级科幻弹窗 */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,5,15,0.7);
            backdrop-filter: blur(10px);
            z-index: 99;
            display: none;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s;
        }

        .modal {
            background: linear-gradient(135deg, #0a1028, #0f183a);
            border: 1px solid #00aaff55;
            border-radius: 24px;
            width: 90%;
            max-width: 480px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 0 80px #00aaff33;
            position: relative;
            animation: popIn 0.4s ease;
        }

        @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
        @keyframes popIn { from { transform:scale(0.9); opacity:0; } to { transform:scale(1); opacity:1; } }

        .modal h2 {
            color: #00aaff;
            font-size: 26px;
            margin-bottom: 20px;
            text-shadow: 0 0 20px #00aaff;
        }

        .modal p {
            color: #c0d8ff;
            font-size: 15px;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        .modal-close {
            padding: 12px 30px;
            background: linear-gradient(90deg, #00aaff, #00ff88);
            border: none;
            border-radius: 12px;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .modal-close:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px #00aaff66;
        }
    </style>
</head>

<body>
    <div class="stars"></div>
    <div class="container">
        <h1 class="title">🧠 全息中枢</h1>
        <p class="subtitle">Robot Holographic Control System</p>

        <div class="grid">
            <div class="card" onclick="showModal('🔮 星枢核心','中枢系统已全面启动\n运行状态：正常\n能源供应：稳定\n系统温度：正常\n防护等级：一级安全')">
                <h3>🔮 星枢核心</h3>
                <p>中枢系统 · 能源监控 · 状态自检</p>
            </div>

            <div class="card" onclick="showModal('🎮 星游秘境','游戏交互系统已开启\n欢迎进入星枢智控游戏世界\n支持：趣味互动、智能对战、休闲模式、动作小游戏')">
                <h3>🎮 星游秘境</h3>
                <p>游戏模式 · 趣味互动 · 娱乐体验</p>
            </div>

            <div class="card" onclick="showModal('💬 智能对话','语音交互系统已连接\n你好！我是星枢智控机器人\n我可以陪你聊天、回答问题、执行你的指令')">
                <h3>💬 智能对话</h3>
                <p>语音聊天 · 智能问答 · 指令交互</p>
            </div>

            <div class="card" onclick="showModal('⚙️ 行动控制','机动控制系统已就绪\n可执行指令：\n移动、转向、动作表演、灯光调节、路径执行')">
                <h3>⚙️ 行动控制</h3>
                <p>动作执行 · 路径规划 · 设备操控</p>
            </div>
        </div>

        <button class="btn-back" onclick="window.location.href='index.html'">← 返回主界面</button>
    </div>

    <!-- 高级弹窗 -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h2 id="modalTitle">标题</h2>
            <p id="modalText">内容</p>
            <button class="modal-close" onclick="closeModal()">确认关闭</button>
        </div>
    </div>

    <script>
        // 星空背景
        const stars = document.querySelector('.stars');
        for(let i=0;i<180;i++){
            let s = document.createElement('div');
            s.style.cssText = `
                position:absolute;
                width:${Math.random()*2.2}px;
                height:${Math.random()*2.2}px;
                background:#fff;
                border-radius:50%;
                top:${Math.random()*100}%;
                left:${Math.random()*100}%;
                opacity:${Math.random()*0.7+0.3};
            `;
            stars.appendChild(s);
        }

        // 高级弹窗控制
        const overlay = document.getElementById('modalOverlay');
        const mTitle = document.getElementById('modalTitle');
        const mText = document.getElementById('modalText');

        function showModal(title, text) {
            mTitle.innerText = title;
            mText.innerText = text;
            overlay.style.display = 'flex';
        }

        function closeModal() {
            overlay.style.display = 'none';
        }
    </script>
</body>
</html>
